# Sao chép sang application-local.properties (đã được gitignore).
# Script start-local.ps1 tự điền kết nối PostgreSQL local riêng của dự án.
app.payos.client-id=
app.payos.api-key=
app.payos.checksum-key=
# Chỉ bật LIVE sau khi cấu hình khóa và webhook HTTPS công khai.
app.payos.mode=DISABLED
app.payos.simulation-enabled=true
app.public-url=http://localhost:8082
# Key trình duyệt: hạn chế HTTP referrer localhost:8082 và Maps JavaScript/Places API.
app.maps.browser-key=
app.maps.server-key=
app.maps.map-id=DEMO_MAP_ID

# OAuth: bật sau khi cấu hình ít nhất một nhà cung cấp đầy đủ.
app.oauth.enabled=${OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.facebook.client-id=
app.oauth.facebook.client-secret=
# Chọn phiên bản Graph API còn được Meta hỗ trợ trong dashboard ứng dụng.
app.oauth.facebook.api-version=

# Twilio Verify: chỉ điền thông tin trong bản local không chia sẻ.
app.verify.service-sid=${TWILIO_VERIFY_SERVICE_SID:}
app.verify.api-key=${TWILIO_VERIFY_API_KEY:}
app.verify.api-secret=${TWILIO_VERIFY_API_SECRET:}
app.support.email=${SUPPORT_EMAIL:}
