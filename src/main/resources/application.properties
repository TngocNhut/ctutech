spring.application.name=luma-tech
server.address=127.0.0.1
server.port=${PORT:8082}
spring.config.import=optional:file:./config/application-local.properties,optional:file:./config/payos-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/luma_shop}
spring.datasource.username=${DB_USER:luma}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.mode=${PAYOS_MODE:DISABLED}
app.payos.simulation-enabled=${PAYOS_SIMULATION_ENABLED:false}
app.payos.config-encryption-key=${PAYOS_CONFIG_ENCRYPTION_KEY:}
app.public-url=${PUBLIC_URL:http://localhost:8082}
app.maps.browser-key=${GOOGLE_MAPS_BROWSER_KEY:}
app.maps.server-key=${GOOGLE_MAPS_SERVER_KEY:}
app.maps.map-id=${GOOGLE_MAPS_MAP_ID:DEMO_MAP_ID}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.oauth.enabled=${OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.facebook.api-version=${FACEBOOK_API_VERSION:}

# Twilio Verify (configurar service six-digit and SendGrid email integration; no credentials in source)
app.verify.service-sid=${TWILIO_VERIFY_SERVICE_SID:}
app.verify.api-key=${TWILIO_VERIFY_API_KEY:}
app.verify.api-secret=${TWILIO_VERIFY_API_SECRET:}
app.support.email=${SUPPORT_EMAIL:}
