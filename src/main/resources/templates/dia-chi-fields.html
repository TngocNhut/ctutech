<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="fields(prefix)">
<div class="address-fields"><label for="address-name">Người nhận</label><input id="address-name" th:field="*{__${prefix}__tenNguoiNhan}" autocomplete="name" maxlength="120" required><small class="field-error" th:errors="*{__${prefix}__tenNguoiNhan}"></small><label for="address-phone">Điện thoại nhận hàng</label><input id="address-phone" th:field="*{__${prefix}__soDienThoai}" type="tel" autocomplete="tel" maxlength="20" required><small class="field-error" th:errors="*{__${prefix}__soDienThoai}"></small><label for="address-city">Tỉnh / Thành phố</label><select id="address-city" th:field="*{__${prefix}__tinhThanh}" autocomplete="address-level1" required><option value="">Chọn tỉnh / thành phố</option><option th:if="*{__${prefix}__tinhThanh != null and !__${prefix}__tinhThanh.isBlank()}" th:value="*{__${prefix}__tinhThanh}" th:text="*{__${prefix}__tinhThanh}"></option></select><small class="field-error" th:errors="*{__${prefix}__tinhThanh}"></small><label for="address-ward">Phường / Xã</label><select id="address-ward" th:field="*{__${prefix}__phuongXa}" autocomplete="address-level2" required><option value="">Chọn phường / xã</option><option th:if="*{__${prefix}__phuongXa != null and !__${prefix}__phuongXa.isBlank()}" th:value="*{__${prefix}__phuongXa}" th:text="*{__${prefix}__phuongXa}"></option></select><small class="field-error" th:errors="*{__${prefix}__phuongXa}"></small><label for="address-street">Số nhà, đường, căn hộ</label><input id="address-street" th:field="*{__${prefix}__diaChiCuThe}" autocomplete="street-address" maxlength="255" required><small class="field-error" th:errors="*{__${prefix}__diaChiCuThe}"></small><label for="address-note">Ghi chú giao nhận (không bắt buộc)</label><textarea id="address-note" th:field="*{__${prefix}__ghiChu}" maxlength="500" rows="2"></textarea><small class="field-error" th:errors="*{__${prefix}__ghiChu}"></small></div>
<div class="map-picker" th:attr="data-map-key=${mapKey},data-map-id=${mapId}"><p>Giao nhận tại Việt Nam. Bạn có thể nhập tay; cửa hàng sẽ kiểm tra địa chỉ khi xác nhận đơn.</p><button type="button" class="btn map-open" data-map-open><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Chọn điểm trên Google Maps</button><p data-map-status role="status" aria-live="polite"></p><div data-map-panel hidden><div data-place-search></div><div data-map-canvas class="map-canvas" aria-label="Bản đồ chọn điểm giao nhận"></div><button type="button" class="btn btn-outline-secondary" data-map-location>Dùng vị trí của tôi</button><label class="check-label"><input type="checkbox" th:field="*{__${prefix}__xacNhanPin}" data-pin-confirm>Tôi đã kiểm tra pin giao nhận trên bản đồ</label></div><button type="button" class="btn btn-link" data-map-clear>Bỏ điểm bản đồ, dùng địa chỉ nhập tay</button><input type="hidden" th:field="*{__${prefix}__placeId}" data-place-id><input type="hidden" th:field="*{__${prefix}__viDo}" data-lat><input type="hidden" th:field="*{__${prefix}__kinhDo}" data-lng></div>
</section></body></html>
