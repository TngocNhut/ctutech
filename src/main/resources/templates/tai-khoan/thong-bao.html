<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Thông báo của bạn')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><a href="/tai-khoan" class="back-arrow" aria-label="Về tài khoản" title="Về tài khoản"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1>Thông báo của bạn.</h1><div th:replace="~{dung-chung :: messages}"></div><p th:text="${soChuaDoc}+' thông báo chưa đọc'"></p><nav class="account-nav outlined-links" aria-label="Lọc thông báo"><a href="/tai-khoan/thong-bao" th:attr="aria-current=${!chuaDoc?'page':null}">Tất cả</a><a href="/tai-khoan/thong-bao?chuaDoc=true" th:attr="aria-current=${chuaDoc?'page':null}">Chưa đọc</a><a href="/tai-khoan/theo-doi">Sản phẩm theo dõi</a><a href="/uu-dai">Ưu đãi</a></nav><form th:if="${soChuaDoc>0}" th:action="@{/tai-khoan/thong-bao/doc-tat-ca}" method="post"><button class="btn btn-outline-secondary">Đánh dấu tất cả đã đọc</button></form><p class="demo-note">Mở thông báo sẽ đánh dấu thông báo đó là đã đọc.</p>
<p class="empty" th:if="${thongBaoTrongTaiKhoan.isEmpty()}">Không có thông báo trong trang này.</p>
<article class="notification-entry" th:each="n:${thongBaoTrongTaiKhoan}" th:classappend="${n.NgayDoc==null?'unread':''}" th:attr="data-notification-id=${n.MaThongBao}"><div><h2 class="h5" th:text="${n.TieuDe}"></h2><p class="product-description-text" th:text="${n.NoiDung}"></p><small th:text="${n.thoi_diem+' · '+(n.NgayDoc==null?'Chưa đọc':'Đã đọc')}"></small></div><form th:action="@{/tai-khoan/thong-bao/{id}/mo(id=${n.MaThongBao})}" method="post"><button class="btn btn-outline-secondary">Mở thông báo</button></form></article>
<nav class="catalog-pagination" aria-label="Phân trang thông báo"><a th:if="${trang>1}" th:href="@{/tai-khoan/thong-bao(chuaDoc=${chuaDoc},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${thongBaoTrongTaiKhoan.size()==30}" th:href="@{/tai-khoan/thong-bao(chuaDoc=${chuaDoc},trang=${trang+1})}">Trang sau</a></nav>
</main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
