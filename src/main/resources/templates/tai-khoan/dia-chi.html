<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Sổ địa chỉ')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><h1>Sổ địa chỉ.</h1><div th:replace="~{dung-chung :: messages}"></div><div><section><article class="cart-line" th:each="a:${diaChi}"><div><h2 class="h5" th:text="${a.TenNguoiNhan}"></h2><p th:text="${a.SoDienThoaiNhan}"></p><p th:text="${a.DiaChiCuThe}+', '+${a.PhuongXa}+', '+${a.TinhThanh}"></p><p><a th:href="@{/tai-khoan/dia-chi/{id}/sua(id=${a.MaDiaChi})}">Sửa địa chỉ</a></p><p th:if="${a.LaMacDinh}">Địa chỉ mặc định</p><p th:if="${a.ViDo != null}">Có điểm giao nhận đã chọn</p></div><form th:action="@{/tai-khoan/dia-chi/{id}/xoa(id=${a.MaDiaChi})}" method="post"><button class="btn btn-outline-secondary">Xóa địa chỉ</button></form></article><p th:if="${diaChi.isEmpty()}">Chưa có địa chỉ đã lưu.</p></section><button type="button" class="btn btn-primary" onclick="document.getElementById('address-dialog').showModal()">Thêm địa chỉ</button><dialog id="address-dialog" class="address-dialog" th:attr="data-has-errors=${loi != null or #fields.hasErrors('form.*')}"><section class="checkout-form"><div class="dialog-heading"><h2 class="h4">Thêm địa chỉ</h2><button type="button" class="dialog-close" aria-label="Đóng" onclick="document.getElementById('address-dialog').close()">×</button></div><form th:action="@{/tai-khoan/dia-chi}" method="post" th:object="${form}"><section th:replace="~{dia-chi-fields :: fields('')}"></section><label class="check-label"><input type="checkbox" name="macDinh" value="true">Đặt làm địa chỉ mặc định</label><button class="btn btn-primary">Lưu địa chỉ</button></form></section></dialog></div></main><footer th:replace="~{dung-chung :: footer}"></footer><script type="module" src="/js/dia-chi.js"></script><script src="/js/address-dialog.js" defer></script></body></html>
