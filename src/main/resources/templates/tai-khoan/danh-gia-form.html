<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Đánh giá của tôi')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page review-edit-page"><a href="/tai-khoan/danh-gia" class="back-arrow" aria-label="Về sản phẩm đã mua" title="Về sản phẩm đã mua"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${banSoan.tenSanPham}"></h1><div th:replace="~{dung-chung :: messages}"></div>
<p>Nhận xét được hiển thị cùng tên cuối trong họ tên hồ sơ và nhãn đã mua. Nội dung là văn bản; không nhập thông tin liên hệ, số tài khoản hoặc mã đơn riêng tư.</p><p th:if="${banSoan.danhGia!=null and banSoan.danhGia.TrangThai=='BI_AN'}" class="alert alert-info">Đánh giá đang bị ẩn. Sửa nội dung giữ nguyên trạng thái ẩn để quản trị kiểm tra lại.</p>
<form class="compact-form admin-section" th:action="@{/tai-khoan/danh-gia/{id}(id=${maSanPham})}" method="post" th:object="${form}">
<label for="review-stars">Số sao</label><select id="review-stars" th:field="*{soSao}"><option value="5">5 sao</option><option value="4">4 sao</option><option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option></select><small class="field-error" th:errors="*{soSao}"></small>
<label for="review-title">Tiêu đề đánh giá</label><input id="review-title" th:field="*{tieuDe}" maxlength="150"><small class="field-error" th:errors="*{tieuDe}"></small>
<label for="review-body">Nội dung đánh giá</label><textarea id="review-body" th:field="*{noiDung}" rows="7" minlength="10" maxlength="2000" required></textarea><small class="field-error" th:errors="*{noiDung}"></small><button class="btn btn-primary">Lưu đánh giá của tôi</button></form>
<section class="admin-section" th:if="${banSoan.danhGia!=null and banSoan.danhGia.PhanHoiQuanTri!=null}"><h2 class="h5">Phản hồi cửa hàng</h2><p class="product-description-text" th:text="${banSoan.danhGia.PhanHoiQuanTri}"></p></section>
</main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
