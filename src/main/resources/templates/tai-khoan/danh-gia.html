<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Đánh giá đã mua')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><a href="/tai-khoan" class="back-arrow" aria-label="Về tài khoản" title="Về tài khoản"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1>Đánh giá sản phẩm đã mua.</h1><p>Mỗi model có một đánh giá của bạn và có thể sửa lại. Các sản phẩm dưới đây thuộc đơn đã hoàn thành và đã ghi thu.</p>
<p class="empty" th:if="${daMua.isEmpty()}">Chưa có sản phẩm đủ điều kiện trong trang này. <a href="/don-hang">Xem đơn hàng</a></p>
<article class="cart-line" th:each="p:${daMua}"><div><h2 class="h5" th:text="${p.ten}"></h2><p th:if="${p.MaDanhGia!=null}" th:text="${p.SoSao+' / 5 · '+(p.TrangThai=='HIEN_THI'?'Đang hiển thị':'Đang được ẩn')}"></p><p th:if="${p.MaDanhGia==null}">Bạn chưa đánh giá model này.</p></div><a th:href="@{/tai-khoan/danh-gia/{id}(id=${p.MaSanPham})}" th:text="${p.MaDanhGia==null?'Viết đánh giá':'Sửa đánh giá'}"></a></article>
<nav class="catalog-pagination" aria-label="Phân trang sản phẩm đã mua"><a th:if="${trang>1}" th:href="@{/tai-khoan/danh-gia(trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${daMua.size()==30}" th:href="@{/tai-khoan/danh-gia(trang=${trang+1})}">Trang sau</a></nav>
</main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
