<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Tạo tài khoản')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="auth-panel"><h1>Tài khoản của bạn.</h1><p>Lưu địa chỉ, theo dõi đơn và tiếp tục mua sắm.</p><div th:replace="~{dung-chung :: messages}"></div><form th:action="@{/dang-ky}" th:object="${form}" method="post"><label for="hoTen">Họ tên</label><input id="hoTen" th:field="*{hoTen}" autocomplete="name" maxlength="120" required><small class="field-error" th:errors="*{hoTen}"></small><label for="email">Email</label><input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="254" required><small class="field-error" th:errors="*{email}"></small><label for="matKhau">Mật khẩu</label><input id="matKhau" name="matKhau" type="password" autocomplete="new-password" minlength="12" maxlength="64" aria-describedby="password-help" required><small id="password-help" aria-live="polite">Mật khẩu cần 12–64 ký tự và không quá 72 byte UTF-8.</small><small class="field-error" th:errors="*{matKhau}"></small><label for="xacNhanMatKhau">Nhập lại mật khẩu</label><input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" autocomplete="new-password" maxlength="64" required><button class="btn btn-primary">Tạo tài khoản</button></form><a class="google-auth" th:if="${nhaCungCapOAuth.contains('google')}" href="/oauth2/authorization/google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.4 3.1-7.6z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10.4 10.4 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.2 13.6a6.2 6.2 0 0 1 0-3.9V7H2.7a10 10 0 0 0 0 9.3z"/><path fill="#EA4335" d="M12 5.5c1.5 0 2.8.5 3.9 1.5l2.9-2.9A10 10 0 0 0 2.7 7l3.5 2.7c.8-2.4 3.1-4.2 5.8-4.2z"/></svg>Tạo tài khoản với Google</a><p class="auth-links">Đã có tài khoản? <a href="/login">Đăng nhập</a></p></main><footer th:replace="~{dung-chung :: footer}"></footer><script src="/js/password-help.js" defer></script></body></html>
