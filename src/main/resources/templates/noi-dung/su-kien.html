<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Sự kiện cửa hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div th:class="${quanTri?'admin-layout shell':'shell'}"><th:block th:if="${quanTri}"><aside th:replace="~{dung-chung :: adminNav}"></aside></th:block><main id="noi-dung" class="admin-main"><h1>Sự kiện cửa hàng.</h1><div th:replace="~{dung-chung :: messages}"></div><p>Thông tin và hoạt động được cửa hàng công bố.</p><nav class="account-nav" th:if="${quanTri}"><a href="/quan-tri/su-kien/moi">Tạo sự kiện</a><a href="/quan-tri/banner">Quản lý banner</a></nav><div class="table-responsive admin-section"><table class="table"><thead><tr><th>Sự kiện</th><th>Bắt đầu (giờ Việt Nam)</th><th th:if="${quanTri}">Trạng thái</th></tr></thead><tbody><tr th:each="e:${suKien}"><td><a th:href="${quanTri?'/quan-tri/su-kien/'+e.MaSuKien:'/su-kien/'+e.DuongDan}" th:text="${e.TieuDe}"></a></td><td th:text="${e.bat_dau}"></td><td th:if="${quanTri}" th:text="${e.TrangThai=='NHAP'?'Bản nháp':(e.TrangThai=='CONG_BO'?'Công bố theo lịch':'Đã ẩn')}"></td></tr></tbody></table><p th:if="${suKien.isEmpty()}">Chưa có sự kiện trong trang này.</p></div><nav th:replace="~{dung-chung :: phanTrang(${quanTri?'/quan-tri/su-kien':'/su-kien'},${trang},${suKien.size()==30},${null},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
