<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Nội dung sự kiện')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/su-kien" class="back-arrow" aria-label="Về sự kiện" title="Về sự kiện"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maSuKien==null?'Tạo sự kiện.':'Nội dung sự kiện.'}"></h1><div th:replace="~{dung-chung :: messages}"></div><form class="compact-form admin-section" th:action="${maSuKien==null?'/quan-tri/su-kien/moi':'/quan-tri/su-kien/'+maSuKien}" th:object="${form}" method="post"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label for="event-title">Tiêu đề sự kiện</label><input id="event-title" th:field="*{tieuDe}" maxlength="160" required><label for="event-slug">Đường dẫn sự kiện</label><input id="event-slug" th:field="*{duongDan}" maxlength="160" pattern="[a-z0-9]+(-[a-z0-9]+)*" required><label for="event-body">Nội dung sự kiện</label><textarea id="event-body" th:field="*{noiDung}" rows="10" maxlength="12000" required></textarea><label for="event-campaign">Mã chiến dịch liên quan (nếu có)</label><input id="event-campaign" th:field="*{chuongTrinh}" type="number" min="1"><small><a href="/quan-tri/khuyen-mai">Mở danh sách chiến dịch</a>. Liên kết này không tự tạo mức giảm giá.</small><label for="event-state">Trạng thái sự kiện</label><select id="event-state" th:field="*{trangThai}"><option value="NHAP">Bản nháp</option><option value="CONG_BO">Công bố theo lịch</option><option value="AN">Ẩn sự kiện</option></select><label for="event-start">Bắt đầu sự kiện (giờ Việt Nam)</label><input id="event-start" th:field="*{batDau}" type="datetime-local" required><label for="event-end">Kết thúc sự kiện (giờ Việt Nam)</label><input id="event-end" th:field="*{ketThuc}" type="datetime-local"><small>Bỏ trống kết thúc nếu không có mốc gỡ bài. Bản nháp và sự kiện ngoài lịch không hiển thị công khai.</small><button class="btn btn-primary">Lưu sự kiện</button></form><a th:if="${maSuKien!=null}" th:href="@{/su-kien/{slug}(slug=${form.duongDan})}">Mở trang công khai theo lịch</a></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
