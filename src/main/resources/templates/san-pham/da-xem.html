<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Sản phẩm đã xem')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><h1>Sản phẩm đã xem.</h1><p>12 model gần nhất trong phiên trình duyệt này, theo cấu hình bạn đã mở gần nhất. Đăng xuất hoặc xóa lịch sử sẽ bỏ danh sách.</p><nav class="account-nav"><a href="/san-pham">Khám phá sản phẩm</a></nav><form th:unless="${luaChon.isEmpty()}" th:action="@{/da-xem/xoa}" method="post"><button class="btn btn-outline-secondary">Xóa danh sách đã xem</button></form><p class="empty" th:if="${luaChon.isEmpty()}">Chưa có sản phẩm trong danh sách đã xem của phiên này.</p><div class="product-grid mt-4"><article class="product" th:each="v:${luaChon}"><a class="product-link" th:href="@{/san-pham/{slug}(slug=${v.sku.duongDan},sku=${v.sku.maBienThe})}"><div class="product-media"><img th:if="${v.anh!=null}" th:src="${v.anh}" th:alt="${'Ảnh tham khảo '+v.sku.tenSanPham}" loading="lazy" width="600" height="600"></div><div class="product-info"><h2 class="h5" th:text="${v.sku.tenSanPham}"></h2><p class="spec" th:text="${v.sku.tenBienThe}"></p><p class="price" th:text="${#numbers.formatDecimal(v.sku.giaBan,0,'POINT',0,'COMMA')+' ₫'}"></p><p class="stock" th:text="${v.sku.tonKhaDung()>0?'Còn hàng':'Tạm hết cấu hình này'}"></p></div></a></article></div></main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
