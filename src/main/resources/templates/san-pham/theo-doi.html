<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><details th:fragment="theoDoi" class="follow-box"><summary>Yêu thích &amp; theo dõi sản phẩm</summary>
<div th:if="${daDangNhap}"><form class="compact-form" th:action="@{/tai-khoan/theo-doi/{id}(id=${sp.maSanPham})}" method="post"><input type="hidden" name="sku" th:value="${sku.maBienThe}"><label class="check-label"><input type="checkbox" name="baoGia" value="true" th:checked="${theoDoi!=null and theoDoi.NhanBaoGiamGia}">Báo khi giá giảm</label><label class="check-label"><input type="checkbox" name="baoHang" value="true" th:checked="${theoDoi!=null and theoDoi.NhanBaoCoHang}">Báo khi có hàng trở lại</label><p>Nhận thông báo trong tài khoản theo giá/có hàng của cả model. Bỏ chọn cả hai để chỉ lưu yêu thích.</p><button class="btn btn-outline-secondary" th:text="${theoDoi==null?'Lưu vào yêu thích':'Cập nhật theo dõi'}"></button></form><p><a href="/tai-khoan/theo-doi">Xem danh sách yêu thích</a></p></div><p th:unless="${daDangNhap}"><a href="/tai-khoan/theo-doi">Đăng nhập để lưu sản phẩm yêu thích</a></p></details></body></html>
