<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Tri thức hỗ trợ')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Tài liệu của bot.</h1><p>Bot chỉ dùng một phiên bản đã duyệt của chủ đề đang hoạt động. Bản nháp và bản ngừng dùng không được dùng cho câu trả lời mới.</p><div th:replace="~{dung-chung :: messages}"></div><nav class="account-nav"><a href="/quan-tri/tri-thuc/moi">Soạn phiên bản mới</a><a href="/quan-tri/chu-de-ho-tro">Chủ đề hỗ trợ</a><a href="/quan-tri/ho-tro">Hàng chờ hỗ trợ</a></nav><div class="table-responsive admin-section"><table class="table"><thead><tr><th>Tài liệu</th><th>Chủ đề</th><th>Phiên bản</th><th>Trạng thái</th><th>Duyệt lúc</th></tr></thead><tbody><tr th:each="d:${taiLieu}"><td><a th:href="@{/quan-tri/tri-thuc/{id}(id=${d.MaTaiLieuHoTro})}" th:text="${d.TieuDe}"></a></td><td th:text="${d.TenChuDe}"></td><td th:text="${d.SoPhienBan}"></td><td th:text="${d.TrangThai=='NHAP'?'Bản nháp':(d.TrangThai=='DA_DUYET'?'Đã duyệt':'Ngừng dùng')}"></td><td th:text="${d.luc_duyet?:'Chưa duyệt'}"></td></tr></tbody></table><p th:if="${taiLieu.isEmpty()}">Chưa có tài liệu ở trang này.</p></div><nav class="catalog-pagination" aria-label="Phân trang tài liệu"><a th:if="${trang>1}" th:href="@{/quan-tri/tri-thuc(trang=${trang-1})}">Trang trước</a><span th:text="${'Trang '+trang}"></span><a th:if="${taiLieu.size()==30}" th:href="@{/quan-tri/tri-thuc(trang=${trang+1})}">Trang tiếp</a></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
