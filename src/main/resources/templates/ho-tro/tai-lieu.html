<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Phiên bản tài liệu hỗ trợ')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/tri-thuc" class="back-arrow" aria-label="Về tài liệu của bot" title="Về tài liệu của bot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${taiLieu.TieuDe}"></h1><div th:replace="~{dung-chung :: messages}"></div><p th:text="${taiLieu.TenChuDe+' · Phiên bản '+taiLieu.SoPhienBan+' · '+(taiLieu.TrangThai=='NHAP'?'Bản nháp':(taiLieu.TrangThai=='DA_DUYET'?'Đã duyệt':'Ngừng dùng'))}"></p><div class="admin-section support-text" th:text="${taiLieu.NoiDungDaSoan}"></div><div class="support-actions"><form th:if="${taiLieu.TrangThai=='NHAP'}" th:action="@{/quan-tri/tri-thuc/{id}/duyet(id=${taiLieu.MaTaiLieuHoTro})}" method="post"><p>Duyệt phiên bản này sẽ ngừng bản đang được dùng của cùng chủ đề.</p><button class="btn btn-primary">Duyệt và dùng cho bot</button></form><form th:unless="${taiLieu.TrangThai=='NGUNG_DUNG'}" th:action="@{/quan-tri/tri-thuc/{id}/ngung(id=${taiLieu.MaTaiLieuHoTro})}" method="post"><button class="btn btn-outline-secondary">Ngừng dùng phiên bản này</button></form><a th:href="@{/quan-tri/tri-thuc/moi(tuBan=${taiLieu.MaTaiLieuHoTro})}">Soạn phiên bản mới từ bản này</a></div><p>Nội dung đã duyệt được giữ nguyên để truy nguồn câu trả lời. Khi cần sửa, tạo và duyệt phiên bản mới.</p></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
