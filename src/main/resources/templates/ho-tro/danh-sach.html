<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Hỗ trợ khách hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div th:class="${quanTri?'admin-layout shell':'shell'}"><th:block th:if="${quanTri}"><aside th:replace="~{dung-chung :: adminNav}"></aside></th:block><main id="noi-dung" class="admin-main"><h1>Hỗ trợ khách hàng.</h1><div th:replace="~{dung-chung :: messages}"></div><p th:unless="${quanTri}">Hỏi cách mua hàng hoặc chuyển cho nhân viên. Nội dung trao đổi chỉ bạn và bộ phận hỗ trợ được xem.</p><form th:unless="${quanTri}" th:action="@{/tai-khoan/ho-tro/mo}" method="post"><button class="btn btn-primary">Mở cuộc hỗ trợ</button></form><nav th:if="${quanTri and laQuanTri}" class="account-nav"><a href="/quan-tri/tri-thuc">Tài liệu của bot</a><a href="/quan-tri/chu-de-ho-tro">Chủ đề hỗ trợ</a></nav>
<form th:if="${quanTri}" action="/quan-tri/ho-tro" class="compact-form admin-section" method="get"><label for="support-state">Trạng thái cuộc hỗ trợ</label><select id="support-state" name="trangThai"><option value="" th:selected="${trangThai==''}">Tất cả</option><option value="DANG_MO" th:selected="${trangThai=='DANG_MO'}">Đang mở</option><option value="DA_DONG" th:selected="${trangThai=='DA_DONG'}">Đã đóng</option></select><label for="support-mode">Người tiếp nhận</label><select id="support-mode" name="cheDo"><option value="" th:selected="${cheDo==''}">Tất cả</option><option value="CHATBOT" th:selected="${cheDo=='CHATBOT'}">Bot hỗ trợ</option><option value="CHO_NHAN_VIEN" th:selected="${cheDo=='CHO_NHAN_VIEN'}">Chờ nhân viên</option><option value="NHAN_VIEN" th:selected="${cheDo=='NHAN_VIEN'}">Đã có nhân viên</option></select><button class="btn btn-outline-secondary">Lọc hỗ trợ</button></form>
<div class="table-responsive admin-section"><table class="table"><thead><tr><th>Cuộc hỗ trợ</th><th th:if="${quanTri}">Khách hàng</th><th>Tiếp nhận</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody><tr th:each="c:${cuocTroChuyen}"><td><a th:href="${(quanTri?'/quan-tri/ho-tro/':'/tai-khoan/ho-tro/')+c.MaCuocTroChuyen}" th:text="${'Hỗ trợ #'+c.MaCuocTroChuyen}"></a></td><td th:if="${quanTri}" th:text="${c.ten_khach}"></td><td th:text="${c.CheDoHoTro=='CHATBOT'?'Bot hỗ trợ':(c.CheDoHoTro=='CHO_NHAN_VIEN'?'Chờ nhân viên':c.ten_phu_trach)}"></td><td th:text="${c.TrangThai=='DANG_MO'?'Đang mở':'Đã đóng'}"></td><td th:text="${c.luc_cap_nhat}"></td></tr></tbody></table><p th:if="${cuocTroChuyen.isEmpty()}">Chưa có cuộc hỗ trợ trong danh sách này.</p></div><nav class="catalog-pagination" aria-label="Phân trang hỗ trợ"><a th:if="${trang>1}" th:href="${(quanTri?'/quan-tri/ho-tro':'/tai-khoan/ho-tro')+'?trang='+(trang-1)+'&amp;trangThai='+trangThai+'&amp;cheDo='+cheDo}">Trang trước</a><span th:text="${'Trang '+trang}"></span><a th:if="${cuocTroChuyen.size()==30}" th:href="${(quanTri?'/quan-tri/ho-tro':'/tai-khoan/ho-tro')+'?trang='+(trang+1)+'&amp;trangThai='+trangThai+'&amp;cheDo='+cheDo}">Trang tiếp</a></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
