<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Chủ đề hỗ trợ')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/chu-de-ho-tro" class="back-arrow" aria-label="Về chủ đề hỗ trợ" title="Về chủ đề hỗ trợ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maChuDe==null?'Thêm chủ đề.':'Sửa chủ đề.'}"></h1><div th:replace="~{dung-chung :: messages}"></div><form class="compact-form admin-section" th:action="${maChuDe==null?'/quan-tri/chu-de-ho-tro/moi':'/quan-tri/chu-de-ho-tro/'+maChuDe}" method="post" th:object="${form}"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label for="topic-code">Ký hiệu chủ đề</label><input id="topic-code" th:field="*{kyHieu}" th:readonly="${maChuDe!=null}" pattern="[A-Z0-9_]{2,50}" maxlength="50" required><label for="topic-name">Tên chủ đề</label><input id="topic-name" th:field="*{ten}" maxlength="120" required><label for="topic-examples">Cụm hỏi nhận diện</label><textarea id="topic-examples" th:field="*{viDu}" rows="6" maxlength="2000" aria-describedby="topic-hint"></textarea><small id="topic-hint">Mỗi dòng một cụm hỏi rõ nghĩa, từ 5–200 ký tự, tối đa 10 dòng. Các cụm được chuẩn hóa dấu và hoa thường.</small><label class="check-label"><input type="checkbox" th:field="*{chuyenNhanVien}">Luôn chuyển nhân viên khi khớp chủ đề</label><label class="check-label"><input type="checkbox" th:field="*{hoatDong}">Bật nhận diện chủ đề</label><button class="btn btn-primary">Lưu chủ đề hỗ trợ</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
