<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Soạn tài liệu hỗ trợ')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/tri-thuc" class="back-arrow" aria-label="Về tài liệu của bot" title="Về tài liệu của bot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1>Soạn phiên bản mới.</h1><div th:replace="~{dung-chung :: messages}"></div><form class="compact-form admin-section" th:action="@{/quan-tri/tri-thuc/moi}" method="post" th:object="${form}"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label for="document-topic">Chủ đề tài liệu</label><select id="document-topic" th:field="*{chuDe}"><option value="0">Chọn chủ đề</option><option th:each="c:${chuDe}" th:value="${c.MaChuDeHoTro}" th:text="${c.TenChuDe}"></option></select><label for="document-title">Tiêu đề tài liệu</label><input id="document-title" th:field="*{tieuDe}" maxlength="150" required><label for="document-content">Nội dung trả lời đã soạn</label><textarea id="document-content" th:field="*{noiDung}" rows="10" maxlength="2000" required></textarea><p>Nội dung là văn bản thuần và được trả lời nguyên văn khi khớp đúng một chủ đề. Kiểm tra tính chính xác trước khi duyệt. Không đưa dữ liệu khách hàng hoặc khóa bí mật vào tài liệu.</p><button class="btn btn-primary">Tạo bản nháp mới</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
