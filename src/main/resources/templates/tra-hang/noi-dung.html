<section th:fragment="noiDung" class="admin-section"><p><strong th:text="${nhanTrangThai[phieu.TrangThai]}"></strong> · <span th:text="${phieu.LoaiTraHang=='SAU_GIAO'?'Trả sau giao':'Kiện giao thất bại'}"></span></p><p th:text="${phieu.LyDo}"></p><p th:if="${phieu.GhiChuXuLy}" th:text="'Kết quả duyệt: '+${phieu.GhiChuXuLy}"></p><p class="table-hint">Vuốt ngang bảng để xem đủ kết quả kiểm hàng.</p><div class="table-responsive" tabindex="0" aria-label="Kết quả kiểm hàng, có thể cuộn ngang"><table class="table return-results"><caption>Số lượng và kết quả kiểm từng dòng</caption><thead><tr><th>Sản phẩm / SKU</th><th>Yêu cầu</th><th>Thực nhận</th><th>Duyệt hoàn</th><th>Nhập lại</th><th>Tiền hoàn</th><th>Kết quả kiểm</th></tr></thead><tbody><tr th:each="d:${dong}"><td><strong th:text="${d.TenSanPhamLucDat}"></strong><br><small th:text="${d.MaHangLucDat}"></small></td><td th:text="${d.SoLuongYeuCau}"></td><td th:text="${d.SoLuongDaNhan}"></td><td th:text="${d.SoLuongDuyetHoan}"></td><td th:text="${d.SoLuongNhapLai}"></td><td th:text="${#numbers.formatDecimal(d.SoTienDuocHoan,0,'POINT',0,'COMMA')}+' ₫'"></td><td th:text="${d.GhiChuKiemHang}"></td></tr></tbody></table></div><p th:text="'Phí giao được duyệt hoàn: '+${#numbers.formatDecimal(phieu.PhiVanChuyenDuocHoan,0,'POINT',0,'COMMA')}+' ₫'"></p><div th:if="${vanDon!=null}"><h2 class="h4">Kiện hoàn về kho</h2><p><strong th:text="${vanDon.MaTheoDoi}"></strong> · <span th:text="${nhanTrangThai[vanDon.TrangThai]}"></span></p><ol class="order-history"><li th:each="e:${suKien}"><strong th:text="${nhanTrangThai[e.TrangThaiGhiNhan]}"></strong><p th:text="${e.GhiChu}"></p><small th:text="${e.ThoiDiem}"></small></li></ol></div><p>Tiền hoàn được xử lý riêng sau kiểm hàng. Hóa đơn mua hàng gốc giữ nguyên.</p></section>
