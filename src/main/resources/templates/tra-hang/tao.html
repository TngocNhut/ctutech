<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Yêu cầu trả hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><a th:href="@{/don-hang/{code}(code=${don.MaDonCongKhai})}" class="back-arrow" aria-label="Về đơn hàng" title="Về đơn hàng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1>Yêu cầu trả hàng.</h1><p>Chọn số máy cần trả. Cửa hàng sẽ duyệt yêu cầu và kiểm hàng trước khi quyết định nhập lại kho hoặc hoàn tiền.</p><div th:replace="~{dung-chung :: messages}"></div><form class="compact-form admin-section" th:action="@{/don-hang/{code}/tra-hang(code=${don.MaDonCongKhai})}" method="post" th:object="${form}"><input type="hidden" th:field="*{khoaChongLap}"><section th:each="d,s:${dong}"><input type="hidden" th:field="*{dong[__${s.index}__].maDong}"><label th:for="'return-qty-'+${s.index}" th:text="${d.TenSanPhamLucDat}+' · '+${d.MaHangLucDat}"></label><p th:text="'Còn có thể trả: '+${d.ConCoTheTra}"></p><input th:id="'return-qty-'+${s.index}" th:field="*{dong[__${s.index}__].soLuong}" type="number" min="0" th:max="${d.ConCoTheTra}" step="1" required><small class="field-error" th:errors="*{dong[__${s.index}__].soLuong}"></small></section><label for="reason">Lý do trả hàng</label><textarea id="reason" th:field="*{lyDo}" maxlength="500" rows="3" required></textarea><small class="field-error" th:errors="*{lyDo}"></small><button class="btn btn-primary">Gửi yêu cầu trả</button></form></main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
