<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Đơn hàng của tôi')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="shell detail-page"><h1>Đơn hàng của bạn.</h1><p th:if="${donHang.isEmpty()}">Không có đơn ở trang này. <a href="/san-pham">Khám phá sản phẩm</a></p><article class="order-card" th:each="d:${donHang}"><div class="order-card-main"><div class="order-list-product" th:each="sp:${d.sanPham}"><img th:if="${sp.anh != null}" th:src="${sp.anh}" th:alt="${sp.TenSanPhamLucDat+' · '+(sp.mau?:'')}" width="90" height="90" loading="lazy"><div class="order-image-placeholder" th:unless="${sp.anh != null}">Chưa có ảnh phiên bản</div><div><h2 class="h5"><a th:href="@{/don-hang/{code}(code=${d.MaDonCongKhai})}" th:text="${sp.TenSanPhamLucDat}"></a></h2><p th:if="${sp.mau != null and !sp.mau.isBlank()}" th:text="${'Màu: '+sp.mau}"></p><p th:text="${'Số lượng: '+sp.SoLuong}"></p></div></div><a th:if="${d.sanPham.isEmpty()}" th:href="@{/don-hang/{code}(code=${d.MaDonCongKhai})}">Xem chi tiết đơn hàng</a><div class="order-list-status"><span th:text="'Đơn: '+${nhanTrangThai[d.TrangThaiDon]}"></span><span th:text="'Thanh toán: '+${nhanTrangThai[d.TrangThaiThanhToan]}"></span></div><small class="order-list-code" th:text="${'Mã đơn: '+d.MaDonCongKhai}"></small></div><strong class="order-card-total" th:text="${#numbers.formatDecimal(d.TongThanhToan,0,'POINT',0,'COMMA')}+' ₫'"></strong></article><nav th:replace="~{dung-chung :: phanTrang('/don-hang',${trang},${donHang.size()==30},${null},${null})}"></nav></main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
