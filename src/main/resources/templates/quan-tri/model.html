<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị model')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><div class="section-top"><h1>Model sản phẩm.</h1><a class="btn btn-primary" href="/quan-tri/model/moi">Tạo model</a></div><div th:replace="~{dung-chung :: messages}"></div><form class="order-filter" action="/quan-tri/model"><label for="model-q">Tìm model</label><input id="model-q" name="q" th:value="${q}" maxlength="100"><button class="btn btn-outline-secondary">Tìm model</button></form><p>Model chứa nội dung chung. Mỗi cấu hình bán hàng có SKU, giá và tồn riêng. Ẩn model để ngừng hiển thị, giữ lịch sử đơn.</p><div class="table-responsive"><table class="table"><caption>30 mục mỗi trang · model theo tìm kiếm</caption><thead><tr><th>Model / Hãng</th><th>Danh mục</th><th>SKU</th><th>Hiển thị</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p:${modelSanPham}"><td><a th:href="@{/quan-tri/model/{id}(id=${p.MaSanPham})}" th:text="${p.TenSanPham}"></a><br><span th:text="${p.TenThuongHieu}"></span></td><td th:text="${p.TenPhanLoai}"></td><td th:text="${p.SoCauHinh}"></td><td th:text="${p.DangHienThi?'Đang hiện':'Đang ẩn'}"></td><td><a th:href="@{/quan-tri/model/{id}(id=${p.MaSanPham})}">Sửa model &amp; SKU</a></td></tr></tbody></table></div><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/model',${trang},${modelSanPham.size()==30},${q},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
