<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Định nghĩa thuộc tính')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/thuoc-tinh" class="back-arrow" aria-label="Về thông số mở rộng" title="Về thông số mở rộng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maThuocTinh==null?'Tạo thuộc tính.':'Định nghĩa thuộc tính.'}"></h1><div th:replace="~{dung-chung :: messages}"></div>
<form class="compact-form admin-section" th:action="${maThuocTinh==null?'/quan-tri/thuoc-tinh/moi':'/quan-tri/thuoc-tinh/'+maThuocTinh}" method="post" th:object="${form}"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div>
<label for="attribute-category">Danh mục của thuộc tính</label><select id="attribute-category" th:field="*{maPhanLoai}"><option value="0">Chọn danh mục</option><option th:each="p:${danhMuc}" th:value="${p.Ma}" th:text="${p.Ten}"></option></select><label for="attribute-code">Ký hiệu thuộc tính</label><input id="attribute-code" th:field="*{kyHieu}" pattern="[A-Z0-9_]{2,50}" maxlength="50" placeholder="VI_DU_PIN_MAH" required><label for="attribute-name">Tên thuộc tính</label><input id="attribute-name" th:field="*{ten}" maxlength="120" required>
<label for="attribute-type">Kiểu giá trị</label><select id="attribute-type" th:field="*{kieu}"><option value="CHU">Văn bản</option><option value="SO">Số</option><option value="CO_KHONG">Có / Không</option></select><label for="attribute-unit">Đơn vị (nếu có)</label><input id="attribute-unit" th:field="*{donVi}" maxlength="30"><label for="attribute-order">Thứ tự hiển thị</label><input id="attribute-order" th:field="*{thuTu}" type="number" min="0" max="10000" required><label class="check-label"><input type="checkbox" th:field="*{choLoc}">Cho dùng thuộc tính trong bộ lọc sản phẩm</label><p>Danh mục và kiểu giá trị được giữ khi đã gán SKU. Tên, đơn vị và thứ tự thay đổi cho nội dung hiện tại; đơn đã mua giữ bản chụp lúc đặt.</p><button class="btn btn-primary">Lưu định nghĩa thuộc tính</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
