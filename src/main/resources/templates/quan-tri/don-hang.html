<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị đơn hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Đơn hàng.</h1><form class="order-filter" action="/quan-tri/don-hang"><label for="state">Trạng thái đơn</label><select id="state" name="trangThai"><option value="">Tất cả</option><option th:each="s:${ {'CHO_XAC_NHAN','DA_XAC_NHAN','DANG_VAN_CHUYEN','CHO_GIAO_HANG','GIAO_THAT_BAI','CHO_HANG_HOAN_VE','HOAN_THANH','DA_HUY','HET_HAN'} }" th:value="${s}" th:text="${nhanTrangThai[s]}" th:selected="${s==trangThai}"></option></select><button class="btn btn-outline-secondary">Lọc đơn</button></form><div class="table-responsive"><table class="table"><caption>30 mục mỗi trang · đơn mới nhất theo bộ lọc</caption><thead><tr><th>Đơn / Người nhận</th><th>Tiền / Phương thức</th><th>Đơn hàng</th><th>Thanh toán</th><th>Vận chuyển</th></tr></thead><tbody><tr th:each="d:${donHang}"><td><a th:href="@{/quan-tri/don-hang/{code}(code=${d.MaDonCongKhai})}" th:text="${d.MaDonCongKhai}"></a><br><span th:text="${d.TenNguoiNhan}"></span></td><td><strong th:text="${#numbers.formatDecimal(d.TongThanhToan,0,'POINT',0,'COMMA')}+' ₫'"></strong><br><span th:text="${d.PhuongThucThanhToan}"></span></td><td th:text="${nhanTrangThai[d.TrangThaiDon]}"></td><td th:text="${nhanTrangThai[d.TrangThaiThanhToan]}"></td><td th:text="${d.TrangThaiVanDon==null?'Chưa tạo vận đơn':nhanTrangThai[d.TrangThaiVanDon]}"></td></tr></tbody></table><p th:if="${donHang.isEmpty()}">Chưa có đơn phù hợp.</p></div><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/don-hang',${trang},${donHang.size()==30},${null},${trangThai})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
