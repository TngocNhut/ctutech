<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị trả hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Trả hàng.</h1><p>30 mục mỗi trang · phiếu mới nhất. Duyệt, kiểm nhận, nhập lại và hoàn tiền được ghi riêng.</p><div class="table-responsive"><table class="table"><thead><tr><th>Phiếu / Đơn</th><th>Loại</th><th>Trạng thái</th><th>Lý do</th></tr></thead><tbody><tr th:each="p:${phieuTra}"><td><a th:href="@{/quan-tri/tra-hang/{id}(id=${p.MaPhieuTraHang})}" th:text="'Phiếu #'+${p.MaPhieuTraHang}"></a><br><span th:text="${p.MaDonCongKhai}"></span></td><td th:text="${p.LoaiTraHang=='SAU_GIAO'?'Trả sau giao':'Kiện giao thất bại'}"></td><td th:text="${nhanTrangThai[p.TrangThai]}"></td><td th:text="${p.LyDo}"></td></tr></tbody></table></div><p th:if="${phieuTra.isEmpty()}">Chưa có phiếu trả.</p><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/tra-hang',${trang},${phieuTra.size()==30},${null},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
