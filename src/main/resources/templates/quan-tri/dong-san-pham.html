<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Dòng sản phẩm')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><div class="section-top"><h1>Dòng sản phẩm.</h1><a class="btn btn-primary" href="/quan-tri/dong-san-pham/moi">Tạo dòng sản phẩm</a></div><div th:replace="~{dung-chung :: messages}"></div><p>Dòng máy thuộc một hãng. Model chỉ được gắn dòng của cùng hãng; dòng đang được model sử dụng sẽ được giữ lại.</p>
<form class="compact-form order-filter" action="/quan-tri/dong-san-pham"><label for="line-brand">Lọc hãng</label><select id="line-brand" name="hang"><option value="0">Tất cả hãng</option><option th:each="h:${thuongHieu}" th:value="${h.Ma}" th:text="${h.Ten}" th:selected="${hang==h.Ma}"></option></select><button class="btn btn-outline-secondary">Lọc dòng sản phẩm</button></form>
<div class="table-responsive"><table class="table"><caption>30 dòng máy mỗi trang</caption><thead><tr><th>Dòng máy</th><th>Hãng</th><th>Model đã gắn</th><th>Thao tác</th></tr></thead><tbody><tr th:each="d:${dongSanPham}"><td><strong th:text="${d.TenDongSanPham}"></strong><br><small th:text="${d.DuongDan}"></small></td><td th:text="${d.TenThuongHieu}"></td><td th:text="${d.so_model}"></td><td><a th:href="@{/quan-tri/dong-san-pham/{id}(id=${d.MaDongSanPham})}">Sửa dòng</a><form th:action="@{/quan-tri/dong-san-pham/{id}/xoa(id=${d.MaDongSanPham})}" method="post"><button class="btn btn-link text-danger">Xóa dòng chưa dùng</button></form></td></tr></tbody></table></div><p th:if="${dongSanPham.isEmpty()}">Chưa có dòng máy trong trang này.</p>
<nav class="catalog-pagination" aria-label="Phân trang dòng sản phẩm"><a th:if="${trang>1}" th:href="@{/quan-tri/dong-san-pham(hang=${hang},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${dongSanPham.size()==30}" th:href="@{/quan-tri/dong-san-pham(hang=${hang},trang=${trang+1})}">Trang sau</a></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
