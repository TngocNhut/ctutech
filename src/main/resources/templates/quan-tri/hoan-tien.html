<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị hoàn tiền')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Hoàn tiền.</h1><p>Không tự chuyển tiền. Admin đối chiếu khoản hoàn, người nhận và chứng từ trước khi ghi nhận kết quả.</p><div class="table-responsive"><table class="table"><caption>30 mục mỗi trang · khoản hoàn mới nhất</caption><thead><tr><th>Khoản hoàn / Đơn</th><th>Số tiền</th><th>Trạng thái</th><th>Chế độ</th><th>Lý do</th></tr></thead><tbody><tr th:each="h:${khoanHoan}"><td><a th:href="@{/quan-tri/hoan-tien/{id}(id=${h.MaHoanTien})}" th:text="'Khoản #'+${h.MaHoanTien}"></a><br><span th:text="${h.MaDonCongKhai}"></span></td><td th:text="${#numbers.formatDecimal(h.SoTienHoan,0,'POINT',0,'COMMA')}+' ₫'"></td><td th:text="${nhanTrangThai[h.TrangThai]}"></td><td th:text="${h.CheDoXuLy=='MO_PHONG'?'Mô phỏng':'Tích hợp thật'}"></td><td th:text="${h.LyDo}"></td></tr></tbody></table></div><p th:if="${khoanHoan.isEmpty()}">Chưa có khoản hoàn.</p><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/hoan-tien',${trang},${khoanHoan.size()==30},${null},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
