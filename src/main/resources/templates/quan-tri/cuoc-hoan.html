<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="cuoc" class="admin-section" th:if="${vanDon!=null}">
<h2 class="h4">Cước vận chuyển chiều hoàn</h2><p>Chi phí cửa hàng trả cho đơn vị vận chuyển. Phí khách đã trả và số tiền duyệt hoàn trên phiếu được theo dõi riêng.</p>
<p th:unless="${daCoCuocGoc}">Cước gốc chưa biết; tổng dưới đây mới gồm các khoản đã ghi.</p><p th:if="${daCoCuocGoc}">Đã ghi cước gốc (0 ₫ cũng là giá trị đã biết).</p>
<p th:text="'Tổng cước đã ghi: '+${#numbers.formatDecimal(tongCuocHoan,0,'POINT',0,'COMMA')}+' ₫'"></p>
<div class="table-responsive" th:if="${!cuocHoan.isEmpty()}"><table class="table"><caption>Sổ cước vận đơn hoàn</caption><thead><tr><th>Loại phí</th><th>Số tiền</th><th>Ghi chú</th></tr></thead><tbody><tr th:each="c:${cuocHoan}"><td th:text="${nhanTrangThai[c.LoaiPhi]}"></td><td th:text="${#numbers.formatDecimal(c.SoTien,0,'POINT',0,'COMMA')}+' ₫'"></td><td th:text="${c.GhiChu}"></td></tr></tbody></table></div>
<form class="compact-form" th:action="@{/quan-tri/tra-hang/{id}/cuoc(id=${phieu.MaPhieuTraHang})}" method="post" th:object="${cuocForm}">
<input type="hidden" th:field="*{khoaChongLap}"><label for="reverse-fee-type">Loại cước chiều hoàn</label><select id="reverse-fee-type" th:field="*{loaiPhi}"><option value="CUOC_GOC">Cước gốc</option><option value="PHU_PHI">Phụ phí</option><option value="GIAM_CUOC">Giảm cước</option></select>
<label for="reverse-fee-amount">Số tiền cước chiều hoàn (VND)</label><input id="reverse-fee-amount" th:field="*{soTien}" type="number" min="0" step="1" max="999999999999999" required><small class="field-error" th:errors="*{soTien}"></small>
<label for="reverse-fee-note">Ghi chú cước chiều hoàn</label><textarea id="reverse-fee-note" th:field="*{ghiChu}" rows="2" maxlength="500" required></textarea><small class="field-error" th:errors="*{ghiChu}"></small><button class="btn btn-outline-secondary">Ghi cước chiều hoàn</button></form></section></body></html>
