<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Giá trị thông số SKU')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a th:href="@{/quan-tri/model/{model}/sku/{sku}/thuoc-tinh(model=${maModel},sku=${maSku})}" class="back-arrow" aria-label="Về thông số SKU" title="Về thông số SKU"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${thuocTinh.TenThuocTinh}"></h1><p th:text="${modelSp.TenSanPham}+' · '+${sku.MaHang}"></p><div th:replace="~{dung-chung :: messages}"></div>
<form class="compact-form admin-section" th:action="@{/quan-tri/model/{model}/sku/{sku}/thuoc-tinh/{attr}(model=${maModel},sku=${maSku},attr=${thuocTinh.MaThuocTinh})}" method="post" th:object="${form}"><label for="attribute-value" th:text="'Giá trị '+${thuocTinh.TenThuocTinh}"></label><th:block th:switch="${thuocTinh.KieuDuLieu}"><textarea th:case="'CHU'" id="attribute-value" th:field="*{giaTri}" rows="3" maxlength="250" required></textarea><input th:case="'SO'" id="attribute-value" th:field="*{giaTri}" type="number" step="0.0001" min="-999999999999.9999" max="999999999999.9999" required><select th:case="'CO_KHONG'" id="attribute-value" th:field="*{giaTri}" required><option value="">Chọn Có hoặc Không</option><option value="true">Có</option><option value="false">Không</option></select></th:block><small th:if="${thuocTinh.DonVi!=null}" th:text="'Đơn vị: '+${thuocTinh.DonVi}"></small><small class="field-error" th:errors="*{giaTri}"></small><p>Giá trị được kiểm tra theo kiểu của thuộc tính và danh mục của SKU. Thay đổi chỉ áp dụng cho cấu hình hiện tại; đơn cũ giữ thông số khi đặt.</p><button class="btn btn-primary">Lưu giá trị thuộc tính</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
