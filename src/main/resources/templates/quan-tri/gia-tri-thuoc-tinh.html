<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Thông số SKU')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a th:href="@{/quan-tri/model/{id}(id=${maModel})}" class="back-arrow" aria-label="Về model" title="Về model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${modelSp.TenSanPham}"></h1><p th:text="${sku.MaHang}+' · '+${sku.TenBienThe}"></p><div th:replace="~{dung-chung :: messages}"></div><p>Giá trị của đúng SKU này; thuộc tính theo danh mục của model. <a href="/quan-tri/thuoc-tinh">Quản lý định nghĩa thuộc tính</a></p>
<div class="table-responsive"><table class="table"><caption>Thuộc tính có thể gán</caption><thead><tr><th>Thông số</th><th>Giá trị hiện tại</th><th>Đơn vị</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a:${thuocTinh}"><td><strong th:text="${a.TenThuocTinh}"></strong><br><small th:text="${a.KyHieu}"></small></td><td th:text="${a.da_gan==null?'Chưa gán':(a.KieuDuLieu=='CO_KHONG'?(a.GiaTriCoKhong?'Có':'Không'):a.gia_tri_form)}"></td><td th:text="${a.DonVi}"></td><td><a th:href="@{/quan-tri/model/{model}/sku/{sku}/thuoc-tinh/{attr}(model=${maModel},sku=${maSku},attr=${a.MaThuocTinh})}">Gán / sửa giá trị</a><form th:if="${a.da_gan!=null}" th:action="@{/quan-tri/model/{model}/sku/{sku}/thuoc-tinh/{attr}/xoa(model=${maModel},sku=${maSku},attr=${a.MaThuocTinh})}" method="post"><button class="btn btn-link text-danger">Bỏ giá trị khỏi SKU</button></form></td></tr></tbody></table></div><p th:if="${thuocTinh.isEmpty()}">Danh mục chưa có định nghĩa thuộc tính mở rộng.</p></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
