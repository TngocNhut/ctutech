<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Nội dung mã giảm giá')}"></head><body>
<header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside>
<main id="noi-dung" class="admin-main"><a href="/quan-tri/ma-giam-gia" class="back-arrow" aria-label="Về danh sách mã" title="Về danh sách mã"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maVoucher==null?'Tạo mã giảm giá.':'Nội dung mã giảm giá.'}"></h1><div th:replace="~{dung-chung :: messages}"></div>
<form class="compact-form admin-section" th:action="${maVoucher==null?'/quan-tri/ma-giam-gia/moi':'/quan-tri/ma-giam-gia/'+maVoucher}" method="post" th:object="${form}">
<div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div>
<label for="voucher-code">Mã giảm giá</label><input id="voucher-code" th:field="*{kyHieu}" th:readonly="${maVoucher!=null}" pattern="[A-Z0-9_-]{2,40}" maxlength="40" required>
<label for="voucher-description">Mô tả mã</label><input id="voucher-description" th:field="*{moTa}" maxlength="255" required>
<label for="voucher-type">Kiểu giảm của mã</label><select id="voucher-type" th:field="*{kieu}"><option value="SO_TIEN">Số tiền VND / đơn</option><option value="PHAN_TRAM">Phần trăm / đơn</option></select>
<label for="voucher-value">Giá trị giảm</label><input id="voucher-value" type="number" th:field="*{giaTri}" min="0.01" step="0.01" required>
<label for="voucher-max">Trần giảm (VND)</label><input id="voucher-max" type="number" th:field="*{toiDa}" min="1" step="1"><small>Phần trăm cần trần giảm dương. Mã giảm số tiền để trống trường này.</small>
<label for="voucher-min">Đơn tối thiểu (VND)</label><input id="voucher-min" type="number" th:field="*{donToiThieu}" min="0" step="1" required>
<label for="voucher-start">Bắt đầu (giờ Việt Nam)</label><input id="voucher-start" type="datetime-local" th:field="*{batDau}" required>
<label for="voucher-end">Kết thúc (giờ Việt Nam)</label><input id="voucher-end" type="datetime-local" th:field="*{ketThuc}" required>
<label for="voucher-limit">Tổng lượt tối đa</label><input id="voucher-limit" type="number" th:field="*{tongLuot}" min="1" required>
<label for="voucher-per-user">Lượt mỗi khách</label><input id="voucher-per-user" type="number" th:field="*{moiKhach}" min="1" required>
<label class="check-label"><input type="checkbox" th:field="*{congKhai}">Hiện trên trang ưu đãi</label>
<label class="check-label"><input type="checkbox" th:field="*{hoatDong}">Bật mã giảm giá</label>
<p>Tắt mã để ngừng áp dụng cho đơn mới. Ký hiệu và các khoản giảm đã chốt trên đơn cũ được giữ lại.</p><button class="btn btn-primary">Lưu mã giảm giá</button></form>
</main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
