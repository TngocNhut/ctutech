<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Nội dung dòng máy')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/dong-san-pham" class="back-arrow" aria-label="Về dòng sản phẩm" title="Về dòng sản phẩm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maDong==null?'Tạo dòng sản phẩm.':'Nội dung dòng sản phẩm.'}"></h1><div th:replace="~{dung-chung :: messages}"></div>
<form class="compact-form admin-section" th:action="${maDong==null?'/quan-tri/dong-san-pham/moi':'/quan-tri/dong-san-pham/'+maDong}" method="post" th:object="${form}"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label for="line-brand">Hãng của dòng máy</label><select id="line-brand" th:field="*{maThuongHieu}"><option value="0">Chọn hãng</option><option th:each="h:${thuongHieu}" th:value="${h.Ma}" th:text="${h.Ten}"></option></select><label for="line-name">Tên dòng sản phẩm</label><input id="line-name" th:field="*{ten}" maxlength="120" required><label for="line-slug">Đường dẫn dòng sản phẩm</label><input id="line-slug" th:field="*{duongDan}" maxlength="120" pattern="[a-z0-9]+(-[a-z0-9]+)*" required><p>Đường dẫn duy nhất trong từng hãng. Khi dòng đã có model, hãng được giữ cố định.</p><button class="btn btn-primary">Lưu dòng sản phẩm</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
