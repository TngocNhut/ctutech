<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Mã giảm giá')}"></head><body>
<header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside>
<main id="noi-dung" class="admin-main"><div class="section-top"><h1>Mã giảm giá.</h1><a class="btn btn-primary" href="/quan-tri/ma-giam-gia/moi">Tạo mã giảm giá</a></div>
<p>Lượt bao gồm đơn đang giữ và đã dùng. Hủy đơn trước bàn giao trả lại lượt. Điều kiện được kiểm tra lại dưới khóa khi đặt hàng.</p>
<div th:replace="~{dung-chung :: messages}"></div><div class="table-responsive"><table class="table"><caption>30 mục mỗi trang · mã mới nhất</caption>
<thead><tr><th>Mã / Mô tả</th><th>Giảm</th><th>Lượt còn</th><th>Hạn (giờ VN)</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="v:${vouchers}">
<td><strong th:text="${v.KyHieu}"></strong><br><span th:text="${v.MoTa}"></span></td><td th:text="${#numbers.formatDecimal(v.GiaTriGiam,0,'POINT',2,'COMMA')+(v.KieuGiam=='PHAN_TRAM'?' %':' ₫')}"></td><td th:text="${v.luot_con}+' / '+${v.TongLuotToiDa}"></td><td th:text="${v.ket_thuc}"></td><td th:text="${v.DangHoatDong?'Đã bật':'Đã tắt'+(v.CongKhai?' · công khai':' · riêng')}"></td><td><a th:href="@{/quan-tri/ma-giam-gia/{id}(id=${v.MaGiamGia})}">Sửa mã</a></td>
</tr></tbody></table></div><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/ma-giam-gia',${trang},${vouchers.size()==30},${null},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
