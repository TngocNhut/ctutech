<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Danh mục quản trị')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><nav class="account-nav"><a href="/quan-tri/danh-muc/phan-loai">Danh mục hàng</a><a href="/quan-tri/danh-muc/thuong-hieu">Thương hiệu</a></nav><div class="section-top"><h1 th:text="${loai=='phan-loai'?'Danh mục hàng.':'Thương hiệu.'}"></h1><a class="btn btn-primary" th:href="@{/quan-tri/danh-muc/{type}/moi(type=${loai})}">Thêm mục</a></div><div th:replace="~{dung-chung :: messages}"></div><p>Ẩn mục để dừng hiển thị và nhận đơn mới cho sản phẩm thuộc mục đó. Lịch sử đơn và hàng đã giữ được bảo toàn.</p><div class="table-responsive"><table class="table"><thead><tr><th>Tên / Đường dẫn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="m:${muc}"><td><a th:href="@{/quan-tri/danh-muc/{type}/{id}(type=${loai},id=${m.Ma})}" th:text="${m.Ten}"></a><br><small th:text="${m.DuongDan}"></small></td><td th:text="${m.DangHienThi?'Đang hiện':'Đang ẩn'}"></td><td><form th:if="${m.DangHienThi}" th:action="@{/quan-tri/danh-muc/{type}/{id}/an(type=${loai},id=${m.Ma})}" method="post"><button class="btn btn-outline-danger">Ẩn mục</button></form></td></tr></tbody></table></div></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
