<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Hàng chờ giao nhận')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Hàng chờ giao nhận.</h1><div th:replace="~{dung-chung :: messages}"></div><p>Nhận việc, lưu ghi chú và theo dõi hạn. Giao lại hoặc giao thành công sẽ đóng công việc tương ứng; đóng thủ công chỉ kết thúc việc theo dõi.</p><nav class="account-nav" aria-label="Trạng thái việc"><a href="/quan-tri/giao-nhan">Đang mở</a><a href="/quan-tri/giao-nhan?daDong=true">Đã đóng</a></nav><article class="cart-line" th:each="v:${viec}"><div><h2 class="h5"><a th:if="${v.MaPhieuTraHang!=null}" th:href="@{/quan-tri/tra-hang/{id}(id=${v.MaPhieuTraHang})}" th:text="'Phiếu trả #'+${v.MaPhieuTraHang}"></a><a th:if="${v.MaPhieuTraHang==null}" th:href="@{/quan-tri/don-hang/{code}(code=${v.MaDonCongKhai})}" th:text="${v.MaTheoDoi}"></a></h2><p th:text="${nhanTrangThai[v.LoaiViec] ?: 'Cần kiểm tra giao nhận'}"></p><p th:text="${v.GhiChu}"></p><p><a th:href="@{/quan-tri/giao-nhan/{id}(id=${v.MaViecXuLy})}">Ghi chú &amp; xử lý việc</a></p><p th:text="'Phụ trách: '+${v.NguoiPhuTrach ?: 'Chưa nhận việc'}"></p></div><form th:unless="${daDong}" th:action="@{/quan-tri/giao-nhan/{id}/nhan(id=${v.MaViecXuLy})}" method="post"><button class="btn btn-outline-secondary">Nhận việc</button></form></article><p th:if="${viec.isEmpty()}">Chưa có việc giao nhận trong trang này.</p><nav class="catalog-pagination" aria-label="Phân trang việc"><a th:if="${trang>1}" th:href="@{/quan-tri/giao-nhan(daDong=${daDong},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${viec.size()==30}" th:href="@{/quan-tri/giao-nhan(daDong=${daDong},trang=${trang+1})}">Trang sau</a></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
