<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị đánh giá')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Đánh giá sau mua.</h1><p>Phản hồi khách hoặc ẩn/hiển thị với lý do. Điểm tổng hợp và báo cáo hài lòng chỉ tính đánh giá đang hiển thị.</p>
<form class="compact-form order-filter" action="/quan-tri/danh-gia"><label for="review-q">Tìm sản phẩm hoặc tên khách</label><input id="review-q" name="q" th:value="${q}" maxlength="100"><label for="review-filter">Trạng thái đánh giá</label><select id="review-filter" name="trangThai"><option value="TAT_CA" th:selected="${trangThai=='TAT_CA'}">Tất cả</option><option value="HIEN_THI" th:selected="${trangThai=='HIEN_THI'}">Đang hiển thị</option><option value="BI_AN" th:selected="${trangThai=='BI_AN'}">Đã ẩn</option></select><button class="btn btn-outline-secondary">Lọc đánh giá</button></form><p th:text="${tong}+' đánh giá phù hợp'"></p>
<div class="table-responsive"><table class="table"><caption>30 đánh giá mỗi trang</caption><thead><tr><th>Sản phẩm / Khách</th><th>Điểm</th><th>Tiêu đề</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="g:${danhGia}"><td><strong th:text="${g.TenSanPham}"></strong><br><small th:text="${g.HoTen}"></small></td><td th:text="${g.SoSao}+' / 5'"></td><td th:text="${g.TieuDe}"></td><td th:text="${g.TrangThai=='HIEN_THI'?'Đang hiển thị':'Đã ẩn'}"></td><td><a th:href="@{/quan-tri/danh-gia/{id}(id=${g.MaDanhGia})}">Phản hồi &amp; kiểm duyệt</a></td></tr></tbody></table></div><p th:if="${danhGia.isEmpty()}">Chưa có đánh giá phù hợp.</p>
<nav class="catalog-pagination" aria-label="Phân trang quản trị đánh giá"><a th:if="${trang>1}" th:href="@{/quan-tri/danh-gia(trangThai=${trangThai},q=${q},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${trang*30<tong}" th:href="@{/quan-tri/danh-gia(trangThai=${trangThai},q=${q},trang=${trang+1})}">Trang sau</a></nav>
</main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
