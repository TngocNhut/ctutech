<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Thông tin SKU')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a th:href="@{/quan-tri/model/{id}(id=${modelSp.MaSanPham})}" class="back-arrow" aria-label="Về model" title="Về model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${maSku==null?'Thêm cấu hình bán hàng.':'Sửa cấu hình bán hàng.'}"></h1><p th:text="${modelSp.TenSanPham}"></p><div th:replace="~{dung-chung :: messages}"></div><section class="admin-section"><form class="compact-form" th:action="${maSku==null?'/quan-tri/model/'+modelSp.MaSanPham+'/sku/moi':'/quan-tri/model/'+modelSp.MaSanPham+'/sku/'+maSku}" method="post" th:object="${form}"><label for="sku-code">Mã SKU nội bộ</label><input id="sku-code" th:field="*{maHang}" maxlength="80" pattern="[A-Za-z0-9._-]+" required><small class="field-error" th:errors="*{maHang}"></small><label for="sku-part">Mã model / part number hãng</label><input id="sku-part" th:field="*{maMayHang}" maxlength="100"><label for="sku-name">Tên cấu hình</label><input id="sku-name" th:field="*{tenBienThe}" maxlength="220" required><label for="sku-color">Màu sắc</label><input id="sku-color" th:field="*{mauSac}" maxlength="60" required><th:block th:unless="${modelSp.LaPhuKien}"><label for="sku-cpu">CPU / Chip</label><input id="sku-cpu" th:field="*{cpu}" maxlength="120" required><label for="sku-gpu">GPU (để trống nếu chưa có nguồn)</label><input id="sku-gpu" th:field="*{gpu}" maxlength="120"><label for="sku-ram">RAM (GB)</label><input id="sku-ram" th:field="*{ram}" type="number" min="0" max="1024" required><label for="sku-storage">Bộ nhớ (GB)</label><input id="sku-storage" th:field="*{luuTru}" type="number" min="1" max="65536" required><label for="sku-screen">Màn hình (inch)</label><input id="sku-screen" th:field="*{manHinh}" type="number" min="1" max="99.9" step="0.1" required><small class="field-error" th:errors="*{manHinh}"></small><label for="sku-os">Hệ điều hành</label><input id="sku-os" th:field="*{heDieuHanh}" maxlength="100" required></th:block><th:block th:if="${modelSp.LaPhuKien}"><p class="hint">SKU phụ kiện dùng màu/phiên bản, giá và tồn. Các trường RAM, bộ nhớ, màn hình không áp dụng.</p><input type="hidden" name="cpu" value="Không áp dụng"><input type="hidden" name="gpu" value=""><input type="hidden" name="ram" value="0"><input type="hidden" name="luuTru" value="0"><input type="hidden" name="manHinh" value="0"><input type="hidden" name="heDieuHanh" value="Không áp dụng"></th:block><label for="sku-list">Giá niêm yết (VND)</label><input id="sku-list" th:field="*{giaTon.giaNiemYet}" type="number" min="1" max="999999999999999" step="1" required><label for="sku-price">Giá bán (VND)</label><input id="sku-price" th:field="*{giaTon.giaBan}" type="number" min="1" max="999999999999999" step="1" required><small class="field-error" th:errors="*{giaTon.giaBan}"></small><label for="sku-cost">Giá vốn (VND)</label><input id="sku-cost" th:field="*{giaTon.giaVon}" type="number" min="0" max="999999999999999" step="1" required><label for="sku-stock">Tồn vật lý</label><input id="sku-stock" th:field="*{giaTon.soLuongTon}" type="number" min="0" max="1000000" step="1" required><small>Số đã giữ cho đơn được kiểm tra lại khi lưu.</small><label for="sku-reason">Lý do tạo / cập nhật</label><textarea id="sku-reason" th:field="*{giaTon.lyDo}" maxlength="255" rows="2" required></textarea><small class="field-error" th:errors="*{giaTon.lyDo}"></small><label class="check-label"><input type="checkbox" th:field="*{kinhDoanh}">Cho phép kinh doanh SKU khi model, hãng và danh mục đang hiện</label><button class="btn btn-primary">Lưu SKU, giá &amp; tồn</button></form></section></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
