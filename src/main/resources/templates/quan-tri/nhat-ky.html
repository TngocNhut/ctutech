<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Nhật ký hệ thống')}"></head><body>
<header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside>
<main id="noi-dung" class="admin-main"><h1 th:text="${loai=='bao-mat'?'Nhật ký bảo mật.':'Nhật ký quản trị.'}"></h1><nav class="account-nav" aria-label="Loại nhật ký"><a href="/quan-tri/nhat-ky/bao-mat">Bảo mật</a><a href="/quan-tri/nhat-ky/quan-tri">Quản trị</a></nav>
<p>Các mã sự kiện ghi bởi máy chủ. Nhật ký bảo mật không chứa mật khẩu, mã xác thực, email nhập vào hoặc IP thô.</p>
<div class="table-responsive"><table class="table"><caption>50 bản ghi mỗi trang · Thời gian Việt Nam</caption><thead><tr><th>Thời gian</th><th>Mã người dùng</th><th>Hành động</th><th>Kết quả / Đối tượng</th><th>Lý do / Mã đối tượng</th></tr></thead><tbody><tr th:each="n:${nhatKy}"><td th:text="${n.ngay}"></td><td th:text="${n.nguoi?:'Chưa xác định'}"></td><td th:text="${n.hanh_dong}"></td><td th:text="${n.doi_tuong}"></td><td th:text="${n.ly_do}"></td></tr></tbody></table></div><p th:if="${nhatKy.isEmpty()}">Chưa có bản ghi trong trang này.</p>
<nav class="catalog-pagination" aria-label="Phân trang nhật ký"><a th:if="${trang>1}" th:href="@{/quan-tri/nhat-ky/{type}(type=${loai},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${nhatKy.size()==50}" th:href="@{/quan-tri/nhat-ky/{type}(type=${loai},trang=${trang+1})}">Trang sau</a></nav>
</main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
