<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Xử lý hoàn tiền')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/hoan-tien" class="back-arrow" aria-label="Về danh sách hoàn tiền" title="Về danh sách hoàn tiền"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="'Khoản hoàn #'+${hoan.MaHoanTien}"></h1><div th:replace="~{dung-chung :: messages}"></div><section class="admin-section"><p><a th:href="@{/quan-tri/don-hang/{code}(code=${hoan.MaDonCongKhai})}" th:text="${hoan.MaDonCongKhai}"></a></p><p class="price" th:text="${#numbers.formatDecimal(hoan.SoTienHoan,0,'POINT',0,'COMMA')}+' ₫'"></p><p><strong th:text="${nhanTrangThai[hoan.TrangThai]}"></strong> · <span th:text="${hoan.CheDoXuLy=='MO_PHONG'?'Dữ liệu mô phỏng, không xác nhận chuyển tiền thật':'Ghi nhận theo chứng từ đối soát'}"></span></p><p th:text="${hoan.LyDo}"></p><p th:if="${hoan.GhiChuXuLy}" th:text="${hoan.GhiChuXuLy}"></p><a th:if="${hoan.DuongDanChungTu}" th:href="@{/don-hang/hoan-tien/{id}/chung-tu(id=${hoan.MaHoanTien})}">Tải chứng từ đối soát</a></section>
<section class="admin-section" th:if="${hoan.TrangThai=='CHO_XU_LY' or hoan.TrangThai=='DANG_XU_LY'}"><h2 class="h4">Ghi nhận hoàn thành theo chứng từ</h2><p>Xác minh thông tin người nhận bằng kênh hỗ trợ của cửa hàng. Không lấy thông tin nhận hoàn từ URL thanh toán. Thao tác dưới đây lưu kết quả, không gọi chuyển tiền.</p><form class="compact-form" th:action="@{/quan-tri/hoan-tien/{id}/xac-nhan(id=${hoan.MaHoanTien})}" method="post" enctype="multipart/form-data" th:object="${form}"><label for="refund-amount">Số tiền hoàn (VND)</label><input id="refund-amount" th:field="*{soTien}" type="number" min="1" step="1" required><label for="refund-account">Tài khoản nhận hoàn</label><input id="refund-account" th:field="*{taiKhoan}" maxlength="50" required><small class="field-error" th:errors="*{taiKhoan}"></small><label for="refund-bank">Ngân hàng nhận hoàn</label><input id="refund-bank" th:field="*{nganHang}" maxlength="100" required><label for="refund-name">Tên người nhận hoàn</label><input id="refund-name" th:field="*{nguoiNhan}" maxlength="120" required><label for="refund-reference">Mã chứng từ / tham chiếu hoàn</label><input id="refund-reference" th:field="*{thamChieu}" maxlength="150" required><label for="refund-file">Chứng từ PDF, PNG hoặc JPEG (tối đa 5 MB)</label><input id="refund-file" name="chungTu" type="file" accept="application/pdf,image/png,image/jpeg" required><label class="check-label"><input type="checkbox" th:field="*{daKiemTra}" required>Đã kiểm tra người nhận, số tiền và chứng từ hoàn</label><small class="field-error" th:errors="*{daKiemTra}"></small><button class="btn btn-primary">Ghi nhận hoàn tiền theo chứng từ</button></form><hr><form class="compact-form" th:action="@{/quan-tri/hoan-tien/{id}/loi(id=${hoan.MaHoanTien})}" method="post"><label for="failure-reason">Lý do chưa hoàn được</label><textarea id="failure-reason" name="lyDo" maxlength="500" required></textarea><button class="btn btn-outline-danger">Ghi thất bại, giữ hạn mức hoàn</button></form></section><form th:if="${hoan.TrangThai=='THAT_BAI'}" th:action="@{/quan-tri/hoan-tien/{id}/thu-lai(id=${hoan.MaHoanTien})}" method="post"><button class="btn btn-outline-secondary">Đưa lại vào hàng chờ</button></form></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
