<fieldset xmlns:th="http://www.thymeleaf.org" th:fragment="fields" class="compact-form"><label for="image-sku">Phạm vi ảnh</label><select id="image-sku" th:field="*{maSku}"><option value="">Dùng chung cho model</option><option th:each="v:${sku}" th:value="${v.MaBienThe}" th:text="${v.MaHang}+' · '+${v.TenBienThe}"></option></select><small>Ảnh dùng chung có thể làm ảnh đại diện. Ảnh riêng SKU ưu tiên khi chọn đúng cấu hình.</small><label for="image-alt">Mô tả ảnh</label><input id="image-alt" th:field="*{moTa}" maxlength="255" required><small class="field-error" th:errors="*{moTa}"></small><label for="image-order">Thứ tự ảnh</label><input id="image-order" th:field="*{thuTu}" type="number" min="0" max="10000" required><label for="image-source">Nguồn ảnh HTTPS</label><input id="image-source" th:field="*{nguon}" type="url" maxlength="2000"><label for="image-usage">Thông tin sử dụng ảnh</label><textarea id="image-usage" th:field="*{thongTinSuDung}" maxlength="500" rows="2"></textarea><label class="check-label"><input type="checkbox" th:field="*{hienThi}">Hiển thị ảnh</label></fieldset>
