<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản lý ảnh sản phẩm')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a th:href="@{/quan-tri/model/{id}(id=${modelSp.MaSanPham})}" class="back-arrow" aria-label="Về model" title="Về model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1>Ảnh sản phẩm.</h1><p th:text="${modelSp.TenSanPham}"></p><div th:replace="~{dung-chung :: messages}"></div><div class="admin-image-grid"><article class="admin-section" th:each="a:${anh}"><img class="admin-image-preview" th:src="${a.DuongDanTep}" th:alt="${a.MoTaThayThe}" width="240" height="180" loading="lazy"><h2 class="h5" th:text="${a.MoTaThayThe}"></h2><p th:text="${a.DangHienThi?'Đang hiện':'Đang ẩn'}+' · Thứ tự '+${a.ThuTu}"></p><p th:if="${a.MaBienThe!=null}" th:text="'Ảnh riêng SKU #'+${a.MaBienThe}"></p><p><a th:href="@{/quan-tri/model/{p}/anh/{id}(p=${modelSp.MaSanPham},id=${a.MaTep})}">Sửa thông tin ảnh</a></p><form th:if="${a.DangHienThi}" th:action="@{/quan-tri/model/{p}/anh/{id}/an(p=${modelSp.MaSanPham},id=${a.MaTep})}" method="post"><button class="btn btn-outline-danger">Ẩn ảnh</button></form></article></div><section class="admin-section"><h2 class="h4">Thêm ảnh</h2><p>PNG hoặc JPEG, tối đa 5 MB, mỗi chiều tối đa 6000 px và tổng tối đa 16 triệu điểm ảnh. Một model có tối đa 24 ảnh đang hiện.</p><form class="compact-form" th:action="@{/quan-tri/model/{id}/anh(id=${modelSp.MaSanPham})}" method="post" enctype="multipart/form-data" th:object="${form}"><label for="product-image-file">Tệp ảnh PNG / JPEG</label><input id="product-image-file" name="tep" type="file" accept="image/png,image/jpeg" required><fieldset th:replace="~{quan-tri/anh-fields :: fields}"></fieldset><button class="btn btn-primary">Tải ảnh lên</button></form></section></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
