<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Phản hồi đánh giá')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/danh-gia" class="back-arrow" aria-label="Về danh sách đánh giá" title="Về danh sách đánh giá"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${danhGia.TenSanPham}"></h1><div th:replace="~{dung-chung :: messages}"></div><section class="admin-section"><h2 class="h5" th:text="${danhGia.SoSao}+' / 5 · '+${danhGia.HoTen}"></h2><p th:text="${danhGia.TieuDe}"></p><p class="product-description-text" th:text="${danhGia.NoiDung}"></p><p th:text="'Dòng đơn bằng chứng: #'+${danhGia.MaChiTietDonHang}"></p></section>
<form class="compact-form admin-section" th:action="@{/quan-tri/danh-gia/{id}(id=${danhGia.MaDanhGia})}" method="post" th:object="${form}"><div class="field-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div>
<label for="review-reply">Phản hồi của cửa hàng</label><textarea id="review-reply" th:field="*{phanHoi}" rows="5" maxlength="2000"></textarea><small>Để trống để gỡ phản hồi. Nội dung phản hồi được hiển thị nguyên văn cùng đánh giá.</small><label class="check-label"><input type="checkbox" th:field="*{hienThi}">Cho hiển thị đánh giá công khai</label>
<label for="review-reason">Lý do kiểm duyệt / phản hồi</label><textarea id="review-reason" th:field="*{lyDo}" rows="2" maxlength="255" required></textarea><small>Lưu riêng trong nhật ký quản trị, không công khai cùng đánh giá.</small><button class="btn btn-primary">Lưu phản hồi và kiểm duyệt</button></form>
</main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
