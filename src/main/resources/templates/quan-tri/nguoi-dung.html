<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản lý người dùng')}"></head><body>
<header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside>
<main id="noi-dung" class="admin-main"><h1>Người dùng.</h1><p>Thay đổi quyền hoặc khóa tài khoản sẽ thu hồi các phiên cũ. Thông tin đơn hàng và giao dịch được giữ nguyên.</p><div th:replace="~{dung-chung :: messages}"></div>
<form class="order-filter" action="/quan-tri/nguoi-dung"><label for="user-q">Tìm tên hoặc email</label><input id="user-q" name="q" th:value="${q}" maxlength="100"><button class="btn btn-outline-secondary">Tìm người dùng</button></form><p th:text="${tong}+' người dùng'"></p>
<p class="empty" th:if="${nguoiDung.isEmpty()}">Không có tài khoản phù hợp. <a href="/quan-tri/nguoi-dung">Xóa tìm kiếm</a></p>
<div class="table-responsive" th:unless="${nguoiDung.isEmpty()}"><table class="table"><caption>30 tài khoản mỗi trang</caption><thead><tr><th>Người dùng</th><th>Quyền</th><th>Trạng thái</th><th>Email</th><th>Thao tác</th></tr></thead><tbody><tr th:each="n:${nguoiDung}">
<td><strong th:text="${n.HoTen}"></strong><br><small th:text="${n.ThuDienTu}"></small></td><td th:text="${n.TenVaiTro=='QuanTri'?'Quản trị':'Khách hàng'}"></td><td th:text="${n.TrangThai=='HOAT_DONG'?'Hoạt động':'Bị khóa'}"></td><td th:text="${n.NgayXacMinhThuDienTu!=null?'Đã xác minh':'Chưa xác minh'}"></td><td><a th:href="@{/quan-tri/nguoi-dung/{id}(id=${n.MaNguoiDung})}">Quyền &amp; phiên</a></td></tr></tbody></table></div>
<nav class="catalog-pagination" aria-label="Phân trang người dùng"><a th:if="${trang>1}" th:href="@{/quan-tri/nguoi-dung(q=${q},trang=${trang-1})}">Trang trước</a><span th:text="'Trang '+${trang}"></span><a th:if="${trang*30<tong}" th:href="@{/quan-tri/nguoi-dung(q=${q},trang=${trang+1})}">Trang sau</a></nav>
</main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
