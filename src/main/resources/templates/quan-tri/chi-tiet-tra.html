<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Xử lý trả hàng')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><a href="/quan-tri/tra-hang" class="back-arrow" aria-label="Về danh sách trả hàng" title="Về danh sách trả hàng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="'Xử lý phiếu #'+${phieu.MaPhieuTraHang}"></h1><a th:href="@{/quan-tri/don-hang/{code}(code=${phieu.MaDonCongKhai})}" th:text="${phieu.MaDonCongKhai}"></a><div th:replace="~{dung-chung :: messages}"></div><section th:replace="~{tra-hang/noi-dung :: noiDung}"></section>
<section class="admin-section" th:if="${phieu.TrangThai=='CHO_DUYET'}"><h2 class="h4">Duyệt yêu cầu</h2><form class="compact-form" th:action="@{/quan-tri/tra-hang/{id}/duyet(id=${phieu.MaPhieuTraHang})}" method="post"><label for="decision">Kết quả</label><select id="decision" name="chapNhan"><option value="true">Chấp nhận nhận hàng để kiểm</option><option value="false">Từ chối yêu cầu</option></select><label for="return-fee">Phí giao được hoàn (VND)</label><input id="return-fee" name="phiGiaoHoan" type="number" min="0" max="999999999999999" value="0" step="1" required><label for="review-note">Kết quả duyệt</label><textarea id="review-note" name="ghiChu" rows="3" maxlength="500" required></textarea><button class="btn btn-primary">Lưu kết quả duyệt</button></form></section>
<section class="admin-section" th:if="${phieu.TrangThai=='CHO_NHAN_HANG'}"><h2 class="h4">Theo dõi kiện &amp; kiểm hàng</h2><form th:if="${vanDon!=null and vanDon.TrangThai=='CHO_BAN_GIAO'}" th:action="@{/quan-tri/tra-hang/{id}/dang-hoan(id=${phieu.MaPhieuTraHang})}" method="post"><button class="btn btn-outline-secondary">Ghi nhận kiện đang về kho</button></form><p>Chỉ ghi khi kho đã nhận và kiểm thực tế. Số duyệt hoàn và số nhập lại có thể khác nhau; số nhập lại chỉ gồm máy đủ điều kiện bán tiếp.</p><form class="compact-form" th:action="@{/quan-tri/tra-hang/{id}/kiem-hang(id=${phieu.MaPhieuTraHang})}" method="post" th:object="${kiemForm}"><fieldset th:each="d,s:${dong}" class="return-inspection"><legend class="h5" th:text="${d.TenSanPhamLucDat}+' · '+${d.MaHangLucDat}"></legend><input type="hidden" th:field="*{dong[__${s.index}__].maDong}"><label th:for="'received-'+${s.index}">Số máy thực nhận</label><input th:id="'received-'+${s.index}" th:field="*{dong[__${s.index}__].daNhan}" type="number" min="0" th:max="${d.SoLuongYeuCau}" step="1" required><label th:for="'approved-'+${s.index}">Số máy duyệt hoàn tiền</label><input th:id="'approved-'+${s.index}" th:field="*{dong[__${s.index}__].duyetHoan}" type="number" min="0" th:max="${d.SoLuongYeuCau}" step="1" required><label th:for="'restock-'+${s.index}">Số máy đủ điều kiện nhập lại</label><input th:id="'restock-'+${s.index}" th:field="*{dong[__${s.index}__].nhapLai}" type="number" min="0" th:max="${d.SoLuongYeuCau}" step="1" required><label th:for="'inspection-note-'+${s.index}">Kết quả kiểm hàng</label><textarea th:id="'inspection-note-'+${s.index}" th:field="*{dong[__${s.index}__].ghiChu}" maxlength="500" rows="2" required></textarea></fieldset><label class="check-label"><input type="checkbox" th:field="*{daKiemTra}" required>Đã nhận và kiểm toàn bộ hàng ghi trên phiếu</label><small class="field-error" th:errors="*{daKiemTra}"></small><button class="btn btn-primary">Chốt kiểm hàng &amp; nhập lại phần đủ điều kiện</button></form></section><p th:if="${phieu.TrangThai=='CHO_HOAN_TIEN'}"><a href="/quan-tri/hoan-tien">Mở hàng chờ hoàn tiền</a></p><section th:replace="~{quan-tri/cuoc-hoan :: cuoc}"></section></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
