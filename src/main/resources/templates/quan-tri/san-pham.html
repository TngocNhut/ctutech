<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Quản trị sản phẩm')}"></head><body><header th:replace="~{dung-chung :: header}"></header><div class="admin-layout shell"><aside th:replace="~{dung-chung :: adminNav}"></aside><main id="noi-dung" class="admin-main"><h1>Sản phẩm &amp; tồn kho</h1><p>Kho mặc định</p><div th:replace="~{dung-chung :: messages}"></div><form class="order-filter" action="/quan-tri/san-pham"><label for="stock-q">Tìm model hoặc SKU</label><input id="stock-q" name="q" th:value="${q}" maxlength="100"><button class="btn btn-outline-secondary">Tìm tồn kho</button></form><div class="table-responsive"><table class="table align-middle"><caption>Giá và tồn của từng cấu hình bán hàng</caption><thead><tr><th scope="col">Sản phẩm / SKU</th><th scope="col">Giá bán</th><th scope="col">Tồn vật lý</th><th scope="col">Đang giữ</th><th scope="col">Khả dụng</th><th scope="col">Thao tác</th></tr></thead><tbody><tr th:each="v:${bienThe}"><td><strong th:text="${v.tenSanPham}"></strong><br><span th:text="${v.tenBienThe}"></span><br><small th:text="${v.maHang}+' · SKU #'+${v.maBienThe}"></small></td><td th:text="${#numbers.formatDecimal(v.giaBan,0,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${v.soLuongTon}"></td><td th:text="${v.soLuongGiu}"></td><td th:text="${v.tonKhaDung()}"></td><td><a th:href="@{/quan-tri/bien-the/{id}(id=${v.maBienThe})}" th:attr="aria-label='Sửa ' + ${v.maHang}">Sửa giá/tồn</a></td></tr></tbody></table></div><nav th:replace="~{dung-chung :: phanTrang('/quan-tri/san-pham',${trang},${bienThe.size()==30},${q},${null})}"></nav></main></div><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
