<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Cập nhật SKU')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="auth-panel"><a href="/quan-tri/san-pham" class="back-arrow" aria-label="Về danh sách sản phẩm" title="Về danh sách sản phẩm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 th:text="${sku.tenSanPham}"></h1><p th:text="${sku.tenBienThe} + ' · ' + ${sku.maHang}"></p><p th:text="'Đang giữ cho đơn: ' + ${sku.soLuongGiu}"></p><div th:replace="~{dung-chung :: messages}"></div><form th:action="@{/quan-tri/bien-the/{id}(id=${sku.maBienThe})}" method="post" th:object="${form}"><label for="giaBan">Giá bán (VND)</label><input id="giaBan" th:field="*{giaBan}" type="number" min="1" max="999999999999999" step="1" required><small class="field-error" th:errors="*{giaBan}"></small><label for="giaNiemYet">Giá niêm yết (VND)</label><input id="giaNiemYet" th:field="*{giaNiemYet}" type="number" min="1" max="999999999999999" step="1" required><small class="field-error" th:errors="*{giaNiemYet}"></small><label for="giaVon">Giá vốn (VND)</label><input id="giaVon" th:field="*{giaVon}" type="number" min="0" max="999999999999999" step="1" required><small class="field-error" th:errors="*{giaVon}"></small><label for="soLuongTon">Tồn vật lý</label><input id="soLuongTon" th:field="*{soLuongTon}" type="number" min="0" max="1000000" step="1" required><small class="field-error" th:errors="*{soLuongTon}"></small><label for="lyDo">Lý do thay đổi</label><input id="lyDo" th:field="*{lyDo}" maxlength="255" required><small class="field-error" th:errors="*{lyDo}"></small><button class="btn btn-primary">Lưu giá và tồn</button></form></main><footer th:replace="~{dung-chung :: footer}"></footer></body></html>
